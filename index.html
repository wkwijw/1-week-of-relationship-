
<script>
/* EMAILJS */
const EMAILJS_PUBLIC_KEY = "lnGuf1E9IcySptYuP";
const EMAILJS_SERVICE_ID = "service_aqsef8w";
const EMAILJS_TEMPLATE_ID = "template_0m6m25j";

let emailReady = false;

try {
  if (window.emailjs) {
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
    emailReady = true;
  }
} catch (error) {
  console.error("EmailJS initialization failed:", error);
}

/* PAGE NAVIGATION */
const pages = [...document.querySelectorAll(".page")];
const progressFill = document.getElementById("progressFill");
const pageCount = document.getElementById("pageCount");
let currentPage = 0;

function showPage(index) {
  if (index < 0 || index >= pages.length) return;

  pages.forEach((page, i) => {
    page.classList.toggle("active", i === index);
  });

  currentPage = index;
  pageCount.textContent = `${index + 1} / ${pages.length}`;
  progressFill.style.width =
    `${((index + 1) / pages.length) * 100}%`;

  window.scrollTo({ top: 0, behavior: "smooth" });
  playSound("page");
}

document.querySelectorAll("[data-next]").forEach(button => {
  button.addEventListener("click", () => {
    showPage(currentPage + 1);
  });
});

document.querySelectorAll("[data-back]").forEach(button => {
  button.addEventListener("click", () => {
    showPage(currentPage - 1);
  });
});

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") showPage(currentPage + 1);
  if (event.key === "ArrowLeft") showPage(currentPage - 1);
});

/* SOUND EFFECTS AND ORIGINAL THEME MELODY */
let audioContext = null;
let musicTimer = null;
let musicPlaying = false;
let melodyIndex = 0;

function getAudioContext() {
  if (!audioContext) {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return null;
    audioContext = new AudioContextClass();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  return audioContext;
}

function tone(frequency, duration = 0.15, volume = 0.035) {
  const ctx = getAudioContext();
  if (!ctx) return;

  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);

  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    volume, ctx.currentTime + 0.025
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001, ctx.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start();
  oscillator.stop(ctx.currentTime + duration + 0.03);
}

function playSound(type) {
  const sounds = {
    page: [523.25, 659.25],
    click: [587.33],
    success: [523.25, 659.25, 783.99],
    wrong: [392, 349.23]
  };

  const notes = sounds[type] || sounds.click;

  notes.forEach((note, index) => {
    setTimeout(() => tone(note, 0.13, 0.025), index * 90);
  });
}

const melody = [
  392, 440, 523.25, 440,
  392, 349.23, 392, 440,
  523.25, 587.33, 523.25, 440,
  392, 349.23, 329.63, 349.23
];

function playMelody() {
  if (!musicPlaying) return;

  const note = melody[melodyIndex % melody.length];
  tone(note, 0.55, 0.018);
  melodyIndex++;

  musicTimer = setTimeout(playMelody, 480);
}

const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", () => {
  getAudioContext();

  musicPlaying = !musicPlaying;

  if (musicPlaying) {
    musicButton.textContent = "♫ Pause our song";
    musicButton.classList.add("playing");
    playMelody();
  } else {
    clearTimeout(musicTimer);
    musicButton.textContent = "♫ Play our song";
    musicButton.classList.remove("playing");
  }
});

/* BUTTON CLICK SOUNDS */
document.addEventListener("click", event => {
  if (event.target.closest("button") &&
      event.target.id !== "musicButton") {
    playSound("click");
  }
});

/* FLOATING PETALS */
const petalsContainer = document.getElementById("petals");
const petalSymbols = ["✿", "❀", "♡", "✧"];

for (let i = 0; i < 22; i++) {
  const petal = document.createElement("span");
  petal.className = "petal";
  petal.textContent =
    petalSymbols[Math.floor(Math.random() * petalSymbols.length)];

  petal.style.left = Math.random() * 100 + "%";
  petal.style.fontSize = (12 + Math.random() * 13) + "px";
  petal.style.animationDuration = (12 + Math.random() * 18) + "s";
  petal.style.animationDelay = (-Math.random() * 25) + "s";

  petalsContainer.appendChild(petal);
}

/* LOVE QUIZ AND EMAIL */
const quizForm = document.getElementById("loveQuiz");
const quizStatus = document.getElementById("quizStatus");
const submitQuiz = document.getElementById("submitQuiz");

quizForm.addEventListener("submit", async event => {
  event.preventDefault();

  const name = document.getElementById("quizName").value.trim();

  if (!name) {
    quizStatus.textContent = "Please enter your name first ♡";
    playSound("wrong");
    return;
  }

  const answers = [];

  for (let i = 1; i <= 5; i++) {
    const selected = quizForm.querySelector(
      `input[name="q${i}"]:checked`
    );

    if (!selected) {
      quizStatus.textContent =
        `Please answer question ${i} first ♡`;
      playSound("wrong");
      return;
    }

    answers.push(`Question ${i}: ${selected.value}`);
  }

  if (!emailReady || !window.emailjs) {
    quizStatus.textContent =
      "Email service isn't available right now. Please try again later.";
    return;
  }

  submitQuiz.disabled = true;
  submitQuiz.textContent = "Sending... ♡";
  quizStatus.textContent = "Sending your answers...";

  try {
    await emailjs.send(
      EMAILJS_SERVICE_ID,
      EMAILJS_TEMPLATE_ID,
      {
        name: name,
        answers: answers.join("\n"),
        time: new Date().toLocaleString()
      }
    );

    quizStatus.textContent =
      "Your answers have been sent! Thank you, pretty girl ♡";

    playSound("success");
    submitQuiz.textContent = "Sent successfully ♡";

  } catch (error) {
    console.error("Email sending failed:", error);

    quizStatus.textContent =
      "Couldn't send your answers. Please try again.";

    submitQuiz.disabled = false;
    submitQuiz.textContent = "Send my answers ♡";
    playSound("wrong");
  }
});

/* CAKE WISH */
const cake = document.getElementById("cake");
const wish = document.getElementById("wish");

function makeWish() {
  wish.classList.add("show");
  cake.textContent = "🕯️";
  playSound("success");
}

cake.addEventListener("click", makeWish);

cake.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    makeWish();
  }
});

/* HIDDEN HEART GAME */
const gameBoard = document.getElementById("gameBoard");
const gameMessage = document.getElementById("gameMessage");
const tiles = [...gameBoard.querySelectorAll(".heart-tile")];

const hiddenHeart = Math.floor(Math.random() * tiles.length);
let heartFound = false;

tiles.forEach((tile, index) => {
  tile.addEventListener("click", () => {
    if (heartFound || tile.disabled) return;

    if (index === hiddenHeart) {
      tile.textContent = "💗";
      tile.classList.add("found");
      tile.disabled = true;
      heartFound = true;

      gameMessage.textContent =
        "You found my heart! Actually, you've had it all along. ♡";

      playSound("success");
    } else {
      tile.textContent = "🌸";
      tile.disabled = true;

      gameMessage.textContent =
        "Not this one! Try another flower. 🌷";

      playSound("wrong");
    }
  });
});

/* FINAL SURPRISE */
const finalButton = document.getElementById("finalButton");
const finalMessage = document.getElementById("finalMessage");

finalButton.addEventListener("click", () => {
  finalMessage.textContent =
    "If I could choose again, I'd still choose you. I love you, Lidia! ♡";

  finalButton.textContent = "You're my favourite person ♡";

  playSound("success");

  for (let i = 0; i < 12; i++) {
    setTimeout(() => {
      const heart = document.createElement("div");
      heart.textContent = ["💗", "💕", "🌷", "🦋"][
        Math.floor(Math.random() * 4)
      ];

      heart.style.position = "fixed";
      heart.style.left = Math.random() * 90 + "vw";
      heart.style.top = "100vh";
      heart.style.fontSize = "24px";
      heart.style.pointerEvents = "none";
      heart.style.zIndex = "10";
      heart.style.transition = "transform 3s ease, opacity 3s ease";

      document.body.appendChild(heart);

      requestAnimationFrame(() => {
        heart.style.transform =
          `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
        heart.style.opacity = "0";
      });

      setTimeout(() => heart.remove(), 3100);
    }, i * 120);
  }
});

/* START */
showPage(0);
</script>
</body>
</html>
